app = "corafone-collector"
primary_region = "sjc"          # near Vapi's us-west-2; keeps the tool round trip <20ms

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false     # cold start == dead air. never scale to zero.
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
