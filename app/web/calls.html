<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Call review</title>

<script>
  try {
    const t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch {}
</script>

<style>
  /* Same token system as the call page, so the two read as one product. */
  :root {
    --bg: #fff;
    --surface: #f5f5f7;
    --raised: #fff;
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --hairline: rgba(0, 0, 0, .10);
    --accent: #0068d1;
    --good: #087f43;
    --good-bg: #e7f6ed;
    --warn: #6b4500;
    --warn-bg: #fff8e6;
    --danger: #c9252d;
    --danger-bg: #fdecec;
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 10px 30px rgba(0, 0, 0, .06);
    --gutter: clamp(1.25rem, 5vw, 2rem);
    --radius: 18px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000; --surface: #1c1c1e; --raised: #2c2c2e;
      --text: #f5f5f7; --text-2: #98989d; --hairline: rgba(255, 255, 255, .13);
      --accent: #0a84ff;
      --good: #30d158; --good-bg: #0e2f18;
      --warn: #f5d99a; --warn-bg: #2a2000;
      --danger: #ff453a; --danger-bg: #3a0f0d;
      --shadow: 0 1px 2px rgba(0, 0, 0, .6), 0 10px 34px rgba(0, 0, 0, .55);
    }
  }
  :root[data-theme="dark"] {
      --bg: #000; --surface: #1c1c1e; --raised: #2c2c2e;
      --text: #f5f5f7; --text-2: #98989d; --hairline: rgba(255, 255, 255, .13);
      --accent: #0a84ff;
      --good: #30d158; --good-bg: #0e2f18;
      --warn: #f5d99a; --warn-bg: #2a2000;
      --danger: #ff453a; --danger-bg: #3a0f0d;
      --shadow: 0 1px 2px rgba(0, 0, 0, .6), 0 10px 34px rgba(0, 0, 0, .55);
  }
  :root { color-scheme: light dark; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"]  { color-scheme: dark; }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
    font: 400 16px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
          system-ui, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  main { max-width: 56rem; margin: 0 auto; padding: clamp(2.5rem, 8vh, 4.5rem) var(--gutter) 5rem; }

  .eyebrow { margin: 0 0 .6rem; font-size: .75rem; font-weight: 590; letter-spacing: .08em;
             text-transform: uppercase; color: var(--text-2); }
  h1 { margin: 0 0 2rem; font-size: clamp(2rem, 5vw, 2.75rem); font-weight: 600;
       letter-spacing: -0.022em; line-height: 1.06; }

  /* --- summary ---------------------------------------------------------- */
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 1px;
    background: var(--hairline); border: 1px solid var(--hairline);
    border-radius: var(--radius); overflow: hidden; margin-bottom: 2.5rem;
    box-shadow: var(--shadow);
  }
  .stat { background: var(--surface); padding: 1.1rem 1.25rem; }
  .stat dt { margin: 0 0 .3rem; font-size: .8125rem; color: var(--text-2); }
  .stat dd { margin: 0; font-size: 1.75rem; font-weight: 600; letter-spacing: -0.02em; }
  .stat dd small { font-size: .875rem; font-weight: 400; color: var(--text-2); letter-spacing: 0; }
  .stat[data-tone="danger"] dd { color: var(--danger); }
  .stat[data-tone="good"] dd { color: var(--good); }

  /* --- call cards ------------------------------------------------------- */
  .calls { display: grid; gap: .875rem; }
  details {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  summary {
    display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
    padding: 1.1rem 1.25rem; cursor: pointer; list-style: none;
    min-height: 44px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after {
    content: ""; margin-left: auto; flex: none;
    width: 9px; height: 9px; border-right: 2px solid var(--text-2); border-bottom: 2px solid var(--text-2);
    transform: rotate(45deg); transition: transform .2s ease;
  }
  details[open] summary::after { transform: rotate(-135deg); }
  summary:hover { background: var(--raised); }

  .when { font-size: .9375rem; font-weight: 500; }
  .cid { font-family: var(--mono); font-size: .8125rem; color: var(--text-2); }

  .badge {
    padding: .2rem .55rem; border-radius: 980px; font-size: .75rem; font-weight: 590;
    letter-spacing: .01em; white-space: nowrap;
  }
  .badge[data-kind="booked"] { background: var(--good-bg); color: var(--good); }
  .badge[data-kind="none"]   { background: var(--raised); color: var(--text-2); border: 1px solid var(--hairline); }
  .badge[data-kind="cease"]  { background: var(--warn-bg); color: var(--warn); }
  .badge[data-kind="flag"]   { background: var(--danger-bg); color: var(--danger); }
  .badge[data-kind="rung"]   { background: var(--raised); color: var(--text-2); border: 1px solid var(--hairline);
                               font-family: var(--mono); }

  .body { padding: 0 1.25rem 1.25rem; border-top: 1px solid var(--hairline); }
  h2 { margin: 1.5rem 0 .75rem; font-size: .75rem; font-weight: 590; letter-spacing: .08em;
       text-transform: uppercase; color: var(--text-2); }

  /* --- the validator trace: the point of this page ----------------------- */
  .trace { display: grid; gap: .5rem; }
  .step {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: .75rem;
    background: var(--raised); border: 1px solid var(--hairline); border-radius: 12px;
    padding: .75rem .9rem; font-size: .875rem;
  }
  @media (max-width: 40rem) { .step { grid-template-columns: 1fr; } }
  .step .label { font-size: .6875rem; letter-spacing: .06em; text-transform: uppercase;
                 color: var(--text-2); margin-bottom: .2rem; }
  .step code { font-family: var(--mono); font-size: .8125rem; word-break: break-word; }
  .step .said { font-weight: 500; }
  .verdict { font-family: var(--mono); font-size: .75rem; font-weight: 590; }
  .verdict[data-v="accept"]   { color: var(--good); }
  .verdict[data-v="counter"]  { color: var(--accent); }
  .verdict[data-v="hardship"] { color: var(--warn); }
  .verdict[data-v="error"]    { color: var(--danger); }

  pre.transcript {
    margin: 0; padding: 1rem; background: var(--raised); border: 1px solid var(--hairline);
    border-radius: 12px; white-space: pre-wrap; word-break: break-word;
    font: 400 .875rem/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    max-height: 22rem; overflow-y: auto;
  }
  .transcript b { font-weight: 590; }

  a { color: var(--accent); }
  .empty {
    background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius);
    padding: 2rem 1.5rem; text-align: center; color: var(--text-2); box-shadow: var(--shadow);
  }
  .empty strong { display: block; color: var(--text); font-weight: 590; margin-bottom: .4rem; }
  .empty code { font-family: var(--mono); font-size: .8125rem; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>

<main>
  <p class="eyebrow">Corafone</p>
  <h1>Call review</h1>
  <dl class="stats" id="stats"></dl>
  <div class="calls" id="calls"></div>
</main>

<script type="module">
  const CALLS = __DATA__;

  const money = n => "$" + Number(n).toFixed(2);
  const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  const when = ts => new Date(ts * 1000).toLocaleString(undefined,
    { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

  const dur = c => (c.end && c.ts) ? `${Math.round(c.end - c.ts)}s` : "";

  // --- summary -----------------------------------------------------------
  const booked = CALLS.filter(c => c.outcome && c.outcome.ok);
  const ceased = CALLS.filter(c => typeof c.outcome === "string" && c.outcome !== "no_agreement");
  const flagged = CALLS.filter(c => (c.compliance_flags || []).length);
  const collected = booked.reduce((s, c) => s + (c.outcome.total || 0), 0);

  const stat = (label, value, sub = "", tone = "") => `
    <div class="stat"${tone ? ` data-tone="${tone}"` : ""}>
      <dt>${label}</dt><dd>${value}${sub ? ` <small>${sub}</small>` : ""}</dd>
    </div>`;

  document.getElementById("stats").innerHTML =
      stat("Calls", CALLS.length)
    + stat("Agreements", booked.length, CALLS.length ? `of ${CALLS.length}` : "", booked.length ? "good" : "")
    + stat("Collected", money(collected))
    + stat("Cease / dispute", ceased.length)
    + stat("Compliance flags", flagged.length, "", flagged.length ? "danger" : "");

  // --- one call ----------------------------------------------------------
  const badges = c => {
    const out = [];
    if (c.outcome && c.outcome.ok)
      out.push(`<span class="badge" data-kind="booked">Booked ${money(c.outcome.total)}</span>`);
    else if (typeof c.outcome === "string" && c.outcome !== "no_agreement")
      out.push(`<span class="badge" data-kind="cease">${esc(c.outcome).replace(/_/g, " ")}</span>`);
    else if (c.outcome !== undefined)
      out.push(`<span class="badge" data-kind="none">No agreement</span>`);
    if (c.rung !== undefined && c.rung !== null)
      out.push(`<span class="badge" data-kind="rung">rung ${c.rung}</span>`);
    for (const f of c.compliance_flags || [])
      out.push(`<span class="badge" data-kind="flag">${esc(f)}</span>`);
    return out.join("");
  };

  // The whole reason this page exists: what the agent was asked, and what the
  // validator issued back. Every spoken figure should be traceable to a right column.
  const trace = c => (c.tools || []).map(t => {
    const o = t.out || {};
    const v = o.verdict || (o.ok === true ? "booked" : o.ok === false ? "refused" : o.error ? "error" : "ok");
    const terms = o.terms
      ? `${money(o.terms.total)} · ${o.terms.schedule.map(p => `${money(p.amount)} d${p.day}`).join(" · ")}`
      : o.reason || o.error || "";
    return `
      <div class="step">
        <div>
          <div class="label">${esc(t.tool || "tool")}</div>
          <code>${esc(JSON.stringify(t.args ?? {}))}</code>
        </div>
        <div>
          <div class="label">validator <span class="verdict" data-v="${esc(v)}">${esc(v)}</span></div>
          ${terms ? `<code>${esc(terms)}</code>` : ""}
          ${o.say ? `<div class="said">“${esc(o.say)}”</div>` : ""}
        </div>
      </div>`;
  }).join("");

  const transcript = t => esc(t || "")
    .replace(/^(AI|User):/gm, "<b>$1:</b>");

  document.getElementById("calls").innerHTML = CALLS.length ? CALLS.map(c => `
    <details>
      <summary>
        <span class="when">${when(c.ts)}</span>
        ${dur(c) ? `<span class="cid">${dur(c)}</span>` : ""}
        ${badges(c)}
        <span class="cid">${esc(String(c.call).slice(0, 8))}</span>
      </summary>
      <div class="body">
        ${c.tools && c.tools.length ? `<h2>Validator trace</h2><div class="trace">${trace(c)}</div>` : ""}
        ${c.transcript ? `<h2>Transcript</h2><pre class="transcript">${transcript(c.transcript)}</pre>` : ""}
        ${c.recording ? `<h2>Recording</h2><a href="${esc(c.recording)}">Open the audio</a>` : ""}
      </div>
    </details>`).join("") : `
    <div class="empty">
      <strong>No calls logged yet</strong>
      Rows land here when Vapi posts the end-of-call report. If calls are happening but this
      stays empty, the assistant is missing the <code>x-vapi-secret</code> header on its
      server URL — re-run <code>python -m agent.deploy_assistant</code>.
    </div>`;
</script>
