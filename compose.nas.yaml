name: voice-agent
# NAS deploy, app + Cloudflare tunnel, no published ports:
#   touch agreements.jsonl && docker compose -f compose.nas.yaml up -d --build
services:
  agent:
    build: .
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - ./agreements.jsonl:/app/agreements.jsonl   # survives rebuilds

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Quick tunnel: hostname changes on every restart, so update PUBLIC_HOST and re-sync.
    # Named tunnel instead: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate --url http://agent:8080
    depends_on: [agent]
